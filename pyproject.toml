[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netarchitect"
version = "1.0.0"
description = "Algorithmic Network Planning & Self-Explaining Architecture Engine (CIC-307)"
authors = [{ name = "Anirudh Negi (05414802724)", email = "anirudhnegi2007@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
netarchitect = "netarchitect.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["netarchitect*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
